<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
  body { background: radial-gradient(90% 80% at 20% 0%, #2b1f6b 0%, transparent 60%), radial-gradient(70% 70% at 100% 100%, #0b4f6c 0%, transparent 60%), #07080d; position: relative; }
  .win { position: absolute; left: 70px; top: 70px; width: 1260px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 60px 120px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.1); }
  .win img { display: block; width: 100%; }
  .link { position: absolute; right: 70px; bottom: 60px; width: 380px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 50px 110px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.14), 0 0 80px -20px rgba(14,165,233,.5); }
  .link img { display: block; width: 100%; }
</style></head><body>
  <div class="win"><img src="../screenshots/camera.png"></div>
  <div class="link"><img src="../screenshots/phone-link.png"></div>
</body></html>
