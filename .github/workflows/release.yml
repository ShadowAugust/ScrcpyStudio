# Builds the Windows installer + portable exe and publishes them as a GitHub
# Release when a version tag is pushed (e.g. `npm version patch && git push --follow-tags`).
# The app's updater reads these releases (latest.yml for the installer, the
# portable exe for portable copies).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Release notes from the commits since the previous tag (shown by the in-app updater).
      - name: Create release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "Scrcpy Studio ${GITHUB_REF_NAME#v}" --generate-notes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The native parts (Studio scrcpy server, virtual camera, bridge) are prebuilt
      # in resources/; rebuilding them needs the Android SDK and Visual Studio.
      - name: Build and upload
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
